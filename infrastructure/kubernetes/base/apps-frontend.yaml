apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-frontend
  namespace: urbanflow
  labels:
    app: transport-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transport-frontend
  template:
    metadata:
      labels:
        app: transport-frontend
    spec:
      containers:
        - name: transport-frontend
          image: ghcr.io/urbanflow/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: transport-frontend
  namespace: urbanflow
  labels:
    app: transport-frontend
spec:
  selector:
    app: transport-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP

