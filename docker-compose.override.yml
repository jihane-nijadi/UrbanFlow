version: '3.8'

services:
  frontend:
    # Run the frontend in development mode with source mounted for live reload
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./transport-frontend:/app:delegated
      - frontend_node_modules:/app/node_modules
    ports:
      - "3002:3002"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
      - WATCHPACK_POLLING=true
      - BROWSER=none
      - HOST=0.0.0.0
      - PORT=3002
    command: sh -c "apk add --no-cache nodejs npm && npm install --silent && npm start"
    # Prevent override from affecting production envs if you run `docker-compose -f docker-compose.yml` explicitly

volumes:
  frontend_node_modules:
