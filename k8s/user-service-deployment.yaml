apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: urbanflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: urbanflow-user-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://user-db:5432/transport_db
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: POSTGRES_PASSWORD
        - name: JWT_SECRET
          value: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437"
        - name: JWT_EXPIRATION
          value: "86400000"
