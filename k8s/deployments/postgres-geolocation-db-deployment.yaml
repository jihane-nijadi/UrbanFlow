apiVersion: apps/v1
kind: Deployment
metadata:
  name: geolocation-db
  namespace: urbanflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geolocation-db
  template:
    metadata:
      labels:
        app: geolocation-db
    spec:
      containers:
      - name: geolocation-db
        image: postgres:15-alpine
        imagePullPolicy: Always
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: geolocation_db
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 10


