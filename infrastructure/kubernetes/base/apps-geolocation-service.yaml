apiVersion: apps/v1
kind: Deployment
metadata:
  name: geolocation-service
  namespace: urbanflow
  labels:
    app: geolocation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geolocation-service
  template:
    metadata:
      labels:
        app: geolocation-service
    spec:
      containers:
        - name: geolocation-service
          image: ghcr.io/urbanflow/geolocation-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
              name: http
          env:
            - name: SPRING_APPLICATION_NAME
              value: geolocation-service
            - name: EXTERNAL_API_ENABLE_MOCK
              valueFrom:
                configMapKeyRef:
                  name: urbanflow-config
                  key: GEOLOCATION_EXTERNAL_API_ENABLE_MOCK
            - name: EXTERNAL_API_POLL_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: urbanflow-config
                  key: GEOLOCATION_EXTERNAL_API_POLL_INTERVAL_MS
            - name: GEOLOCATION_PERSISTENCE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: urbanflow-config
                  key: GEOLOCATION_PERSISTENCE_ENABLED
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: urbanflow-secrets
                  key: GEOLOCATION_SERVICE_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: urbanflow-secrets
                  key: GEOLOCATION_SERVICE_DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanflow-secrets
                  key: GEOLOCATION_SERVICE_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 50
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: geolocation-service
  namespace: urbanflow
  labels:
    app: geolocation-service
spec:
  selector:
    app: geolocation-service
  ports:
    - name: http
      port: 8091
      targetPort: http
  type: ClusterIP

