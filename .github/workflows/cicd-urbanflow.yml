name: CI/CD - UrbanFlow to EKS

on:
  push:
    branches: [ dodo , JIJI5 ]
  pull_request:
    branches: [ dodo , JIJI5 ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: user-service
            context: backend-services/user-service
          - name: payment-service
            context: backend-services/payment-service
          - name: ticket-service
            context: backend-services/ticketservice/ticket-service
          - name: route-service
            context: backend-services/route-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests for ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.context }}
        timeout-minutes: 10
        run: |
          echo "=========================================="
          echo "Running unit tests for ${{ matrix.service.name }}"
          echo "=========================================="
          mvn clean test --batch-mode
          echo "✅ Unit tests completed successfully for ${{ matrix.service.name }}"

      - name: Run integration tests for ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.context }}
        timeout-minutes: 15
        run: |
          echo "=========================================="
          echo "Running integration tests for ${{ matrix.service.name }}"
          echo "=========================================="
          # Vérifier si des tests d'intégration existent
          if find src/test -name "*IntegrationTest*.java" -type f | grep -q .; then
            echo "Found integration tests, running them..."
            mvn verify --batch-mode -DskipTests
            echo "✅ Integration tests completed successfully for ${{ matrix.service.name }}"
          else
            echo "ℹ️  No integration tests found for ${{ matrix.service.name }}, skipping..."
          fi

      - name: Display test summary
        if: always()
        working-directory: ${{ matrix.service.context }}
        run: |
          echo "=========================================="
          echo "Test Summary for ${{ matrix.service.name }}"
          echo "=========================================="
          echo ""
          echo "--- Unit Tests (Surefire) ---"
          if [ -d "target/surefire-reports" ]; then
            echo "Test reports available in target/surefire-reports"
            find target/surefire-reports -name "*.txt" -exec echo "Report: {}" \;
          else
            echo "No unit test reports found"
          fi
          echo ""
          echo "--- Integration Tests (Failsafe) ---"
          if [ -d "target/failsafe-reports" ]; then
            echo "Test reports available in target/failsafe-reports"
            find target/failsafe-reports -name "*.txt" -exec echo "Report: {}" \;
          else
            echo "No integration test reports found"
          fi

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.service.name }}
          path: ${{ matrix.service.context }}/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.service.name }}
          path: ${{ matrix.service.context }}/target/failsafe-reports
          retention-days: 7
          if-no-files-found: ignore

  build-and-push:
    name: Build & Push Images to ECR
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            context: backend-services/api-gateway
            image: urbanflow-api-gateway
          - name: user-service
            context: backend-services/user-service
            image: urbanflow-user-service
          - name: payment-service
            context: backend-services/payment-service
            image: urbanflow-payment-service
          - name: ticket-service
            context: backend-services/ticketservice/ticket-service
            image: urbanflow-ticket-service
          - name: route-service
            context: backend-services/route-service
            image: urbanflow-route-service
          - name: geolocation-service
            context: backend-services/geolocation-service
            image: urbanflow-geolocation-service
          - name: transport-frontend
            context: transport-frontend
            image: urbanflow-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.context }}
        env:
          IMAGE_REPO: ${{ vars.ECR_REGISTRY }}/${{ matrix.service.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE_REPO:$IMAGE_TAG" -t "$IMAGE_REPO:latest" .
          docker push "$IMAGE_REPO:$IMAGE_TAG"
          docker push "$IMAGE_REPO:latest"

  deploy:
    name: Deploy to EKS
    needs: [test, build-and-push]
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/dodo'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Apply Kubernetes manifests (kustomize)
        run: |
          kubectl apply -k k8s

      - name: Show rollout status
        run: |
          kubectl get pods -n urbanflow


