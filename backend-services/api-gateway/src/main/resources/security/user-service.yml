paths:
  - pattern: "/api/users/admin/**"
    roles: ["PASSENGER"]
    authenticated: true
    methods: ["GET","POST","PUT","DELETE"]

  - pattern: "/api/users/profile"
    roles: ["PASSENGER"]
    authenticated: true
    methods: ["GET","PUT"]

  - pattern: "/api/test"
    authenticated: false
    methods: ["GET"]

  - pattern: "/**"
    authenticated: true
