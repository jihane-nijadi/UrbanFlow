apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: urbanflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
      - name: ticket-service
        image: urbanflow-ticket-service:latest
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://ticket-db:5432/ticket_db
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: POSTGRES_PASSWORD
        - name: SPRING_RABBITMQ_HOST
          value: rabbitmq
        - name: ROUTE_SERVICE_URL
          value: http://route-service:8081
