server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: true
            routes:
                - id: user-service
                uri: http://localhost:8081
                predicates:
                    - Path=/users/**

                - id: ticket-service
                uri: http://localhost:8082
                predicates:
                - Path=/tickets/**

                - id: trip-service
                uri: http://localhost:8083
                predicates:
                    - Path=/trips/**

                - id: geolocation-service
                uri: http://localhost:8084
                predicates:
                    - Path=/geo/**

                - id: subscription-service
                uri: http://localhost:8085
                predicates:
                    - Path=/subscriptions/**

                - id: notification-service
                uri: http://localhost:8086
                predicates:
                    - Path=/notifications/**
