apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-service
  namespace: urbanflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: route-service
  template:
    metadata:
      labels:
        app: route-service
    spec:
      containers:
      - name: route-service
        image: urbanflow-route-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://route-db:5432/route_db
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: POSTGRES_PASSWORD
        - name: GEOLOCATION_SERVICE_URL
          value: http://geolocation-service:8091
        - name: SPRING_RABBITMQ_HOST
          value: rabbitmq
