<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transport services</title>
  <link rel="icon" href="%PUBLIC_URL%/img.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<!-- Temporary: ensure any previously-registered service workers are unregistered
     so they don't continue serving stale cached assets during development. -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) { r.unregister(); });
    }).catch(function(){});
    navigator.serviceWorker.getRegistration().then(function(r) { if (r) r.unregister(); }).catch(function(){});
  }
</script>
</body>
</html>
