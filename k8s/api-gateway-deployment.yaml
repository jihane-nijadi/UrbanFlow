apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: urbanflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: node:18-alpine   # ← placeholder: remplace par ton image gateway quand tu l'auras
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
