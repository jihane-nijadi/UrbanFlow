
version: '3.8'
services:
  route-db:
    image: postgres:15-alpine
    container_name: urbanflow-route-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hello
      POSTGRES_DB: route_db
    ports:
      - "5433:5432"
    volumes:
      - route-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ticket-db:
    image: postgres:15-alpine
    container_name: urbanflow-ticket-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hello
      POSTGRES_DB: ticket_db
    ports:
      - "5434:5432"
    volumes:
      - ticket-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:15-alpine
    container_name: urbanflow-user-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hello
      POSTGRES_DB: transport_db
    ports:
      - "5435:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: urbanflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  geolocation-service:
    build:
      context: ./backend-services/geolocation-service
      dockerfile: Dockerfile
    container_name: urbanflow-geolocation-service
    environment:
      SPRING_APPLICATION_NAME: geolocation-service
      # Expose mock data by default for local dev; set to false when using external APIs
      EXTERNAL_API_ENABLE_MOCK: "true"
      EXTERNAL_API_POLL_INTERVAL_MS: 5000
      # Optional: enable persistence and datasource for geolocation service
      GEOLOCATION_PERSISTENCE_ENABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://geolocation-db:5432/geolocation_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: hello
    ports:
      - "8091:8091"
    volumes:
      - geolocation-data:/var/lib/geolocation
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      geolocation-db:
        condition: service_healthy

  geolocation-db:
    image: postgres:15-alpine
    container_name: urbanflow-geolocation-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hello
      POSTGRES_DB: geolocation_db
    ports:
      - "5436:5432"
    volumes:
      - geolocation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  route-service:
    build:
      context: ./backend-services/route-service
      dockerfile: Dockerfile
    container_name: urbanflow-route-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://route-db:5432/route_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: hello
      # Geolocation service (internal DNS name)
      GEOLOCATION_SERVICE_URL: http://geolocation-service:8091
      SPRING_RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
      route-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ticket-service:
    build:
      context: ./backend-services/ticketservice/ticket-service
      dockerfile: Dockerfile
    container_name: urbanflow-ticket-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ticket-db:5432/ticket_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: hello
      SPRING_RABBITMQ_HOST: rabbitmq
      ROUTE_SERVICE_URL: http://route-service:8081
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
      route-service:
        condition: service_healthy
      ticket-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./backend-services/user-service
      dockerfile: Dockerfile
    container_name: urbanflow-user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/transport_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: hello
      JWT_SECRET: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      JWT_EXPIRATION: 86400000
    ports:
      - "8083:8083"
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./transport-frontend
      dockerfile: Dockerfile
    container_name: urbanflow-frontend
    # Port mapping removed to avoid conflict with docker-compose.override.yml
    # In development `docker-compose.override.yml` maps the frontend to 3003:3003
    depends_on:
      route-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      geolocation-service:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rabbitmq-data:
    driver: local
  route-db-data:
    driver: local
  ticket-db-data:
    driver: local
  user-db-data:
    driver: local
  geolocation-data:
    driver: local
  geolocation-db-data:
    driver: local
