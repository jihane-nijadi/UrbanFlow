apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: urbanflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: urbanflow-payment-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8085
        env:
        - name: SPRING_RABBITMQ_HOST
          value: rabbitmq
