
version: '3.8'
services:
  route-db:
    image: postgres:15-alpine
    container_name: urbanflow-route-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ROUTE_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - route-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ticket-db:
    image: postgres:15-alpine
    container_name: urbanflow-ticket-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TICKET_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - ticket-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:15-alpine
    container_name: urbanflow-user-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: urbanflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  geolocation-service:
    build:
      context: ./backend-services/geolocation-service
      dockerfile: Dockerfile
    container_name: urbanflow-geolocation-service
    environment:
      SPRING_APPLICATION_NAME: geolocation-service
      # Expose mock data by default for local dev; set to false when using external APIs
      EXTERNAL_API_ENABLE_MOCK: "true"
      EXTERNAL_API_POLL_INTERVAL_MS: 5000
      # Optional: enable persistence and datasource for geolocation service
      GEOLOCATION_PERSISTENCE_ENABLED: "true"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_GEOLOCATION}
      SPRING_DATASOURCE_USERNAME: ${GEOLOCATION_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${GEOLOCATION_DB_PASSWORD}
    ports:
      - "8091:8091"
    volumes:
      - geolocation-data:/var/lib/geolocation
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      geolocation-db:
        condition: service_healthy

  geolocation-db:
    image: postgres:15-alpine
    container_name: urbanflow-geolocation-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${GEOLOCATION_DB_NAME}
    ports:
      - "5436:5432"
    volumes:
      - geolocation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  route-service:
    build:
      context: ./backend-services/route-service
      dockerfile: Dockerfile
    container_name: urbanflow-route-service
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_ROUTE}
      SPRING_DATASOURCE_USERNAME: ${ROUTE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ROUTE_DB_PASSWORD}
      # Geolocation service (internal DNS name)
      GEOLOCATION_SERVICE_URL: http://geolocation-service:8091
      SPRING_RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
      route-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ticket-service:
    build:
      context: ./backend-services/ticketservice/ticket-service
      dockerfile: Dockerfile
    container_name: urbanflow-ticket-service
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_TICKET}
      SPRING_DATASOURCE_USERNAME: ${TICKET_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${TICKET_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      ROUTE_SERVICE_URL: ${ROUTE_SERVICE_URL:-http://route-service:8081}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      PAYMENT_SERVICE_PUBLIC_URL: ${PAYMENT_SERVICE_PUBLIC_URL}
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
      route-service:
        condition: service_healthy
      ticket-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ./backend-services/payment-service
      dockerfile: Dockerfile
    container_name: urbanflow-payment-service
    environment:
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_APPLICATION_NAME: payment-service
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
      ticket-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./backend-services/user-service
      dockerfile: Dockerfile
    container_name: urbanflow-user-service
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_USER}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "8083:8083"
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./transport-frontend
      dockerfile: Dockerfile
    container_name: urbanflow-frontend
    # Port mapping removed to avoid conflict with docker-compose.override.yml
    # In development `docker-compose.override.yml` maps the frontend to 3003:3003
    depends_on:
      route-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      geolocation-service:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rabbitmq-data:
    driver: local
  route-db-data:
    driver: local
  ticket-db-data:
    driver: local
  user-db-data:
    driver: local
  geolocation-data:
    driver: local
  geolocation-db-data:
    driver: local
