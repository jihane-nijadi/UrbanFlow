apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: urbanflow
  labels:
    app: ticket-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: ghcr.io/urbanflow/ticket-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: urbanflow-secrets
                  key: TICKET_SERVICE_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: urbanflow-secrets
                  key: TICKET_SERVICE_DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanflow-secrets
                  key: TICKET_SERVICE_DB_PASSWORD
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: urbanflow-config
                  key: RABBITMQ_HOST
            - name: ROUTE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: urbanflow-config
                  key: ROUTE_SERVICE_INTERNAL_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: urbanflow-config
                  key: PAYMENT_SERVICE_INTERNAL_URL
            - name: PAYMENT_SERVICE_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: urbanflow-config
                  key: PAYMENT_SERVICE_PUBLIC_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: urbanflow
  labels:
    app: ticket-service
spec:
  selector:
    app: ticket-service
  ports:
    - name: http
      port: 8082
      targetPort: http
  type: ClusterIP

