apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-service
  namespace: urbanflow
  labels:
    app: route-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: route-service
  template:
    metadata:
      labels:
        app: route-service
    spec:
      containers:
        - name: route-service
          image: ghcr.io/urbanflow/route-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: urbanflow-secrets
                  key: ROUTE_SERVICE_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: urbanflow-secrets
                  key: ROUTE_SERVICE_DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbanflow-secrets
                  key: ROUTE_SERVICE_DB_PASSWORD
            - name: GEOLOCATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: urbanflow-config
                  key: GEOLOCATION_SERVICE_INTERNAL_URL
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: urbanflow-config
                  key: RABBITMQ_HOST
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: route-service
  namespace: urbanflow
  labels:
    app: route-service
spec:
  selector:
    app: route-service
  ports:
    - name: http
      port: 8081
      targetPort: http
  type: ClusterIP

