spring.application.name=geolocation-service
server.port=8091

# External API polling config
# Option 1: Use a real transit API (uncomment and configure)
# Examples:
# - Transitland: https://transit.land/api/v2/rest/vehicle_positions?feed_onestop_id=F-9q8y-sfmta
# - OpenTripPlanner: http://localhost:8080/otp/routers/default/vehiclePositions
# - Custom API: Your API endpoint that returns bus location data
external.api.url=
external.api.poll-interval-ms=5000
# API key (if required by your API)
external.api.api-key=

# Option 2: Enable mock data generator for testing (when no external API is configured)
# Set to true to generate simulated bus movements in Casablanca area
external.api.enable-mock=true

# Mock bus configuration
# Vitesse des bus en km/h (modifiez cette valeur pour changer la vitesse)
# Valeur recommandée: 30-50 km/h pour un mouvement réaliste
mock.bus.speed-kmh=40

# Intervalle de mise à jour en millisecondes
# Plus petit = mouvement plus fluide mais plus de requêtes
# Valeur recommandée: 1000-3000 ms
mock.bus.update-interval-ms=2000

# Configuration OSRM pour les routes réelles
# URL du service OSRM (utilise le service public par défaut)
# Vous pouvez aussi utiliser votre propre instance OSRM
routing.osrm.url=https://router.project-osrm.org/route/v1/driving
